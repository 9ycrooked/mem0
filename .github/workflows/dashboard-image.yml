name: Build dashboard image

# 自维护 fork 新增。
#
# 为什么要在 GitHub 上构建：部署目标 qmm 只有 1613MB 内存，跑
# `pnpm install`（含 VChart）+ `next build` 会把系统压到 swap 抖动，
# 连 SSH 都连不上（2026-09-27 实际发生过一次，只能重启实例）。
# 所以构建放到 GitHub Actions，服务器只做 docker pull + up。
#
# 镜像推到 GHCR：ghcr.io/9ycrooked/mem0-dashboard
# 首次推送后需要在 GitHub 上把该 package 设为 public，
# 否则服务器拉取时要么登录、要么拉不到。

on:
  push:
    branches: [main]
    paths:
      - "server/dashboard/**"
      - ".github/workflows/dashboard-image.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/mem0-dashboard

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # 构建上下文限定在 dashboard 目录（Dockerfile 里的 COPY . 以此为根）
          context: server/dashboard
          file: server/dashboard/Dockerfile
          push: true
          # latest 供服务器直接拉；同时打上 commit sha 便于回滚
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
